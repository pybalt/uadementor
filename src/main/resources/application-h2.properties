# H2 profile for local development
# In-memory H2 database (resets on JVM exit)
spring.datasource.url=jdbc:h2:mem:uadeMentor;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate behavior: create-drop for fresh schema every run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Use H2 dialect to ensure schema generation is compatible with H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Enable H2 console for inspection (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Optional: file-based H2 (persistent) example ---
# To use a persistent local DB instead, replace the URL above with:
# spring.datasource.url=jdbc:h2:file:./data/uadementor;AUTO_SERVER=TRUE
# and set `spring.jpa.hibernate.ddl-auto=update`
